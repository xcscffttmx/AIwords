services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: ai-wordbook-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-ai_wordbook}
      MYSQL_USER: ${MYSQL_USER:-wordbook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordbook123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ai-wordbook-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 后端 Go 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-wordbook-backend
    restart: unless-stopped
    environment:
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      DB_NAME: ${DB_NAME:-ai_wordbook}
      PORT: 8080
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:-ai-wordbook-secret-key-2026-change-in-production}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QIANWEN_API_KEY: ${QIANWEN_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - ai-wordbook-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # 前端 Nginx 服务：仅内部暴露，统一由 Caddy 对外
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-wordbook-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-wordbook-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Caddy 反向代理：唯一对外入口，自动申请并续期 HTTPS 证书
  caddy:
    image: caddy:2-alpine
    container_name: ai-wordbook-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - ai-wordbook-network

networks:
  ai-wordbook-network:
    driver: bridge

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
